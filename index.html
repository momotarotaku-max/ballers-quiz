<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
    background:#f5f7fa;color:#0a0b0d;display:flex;flex-direction:column;
  }
  header{background:#1b2f6b;color:#fff;height:72px;display:flex;align-items:center;padding:0 28px;padding-top:env(safe-area-inset-top);
    font-weight:900;letter-spacing:.06em;font-size:22px;white-space:nowrap}
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{width:100%;max-width:460px;background:#fff;border:1px solid #dee1e6;border-radius:20px;padding:40px 36px;
    box-shadow:0 6px 24px rgba(27,47,107,.08)}
  h1{font-size:30px;font-weight:900;letter-spacing:.06em;color:#1b2f6b}
  p.lead{color:#5b616e;font-size:16px;margin:8px 0 24px;line-height:1.6}
  label.f{display:block;font-size:15px;font-weight:700;color:#1b2f6b;margin-bottom:8px}
  input[type=password]{width:100%;font-size:22px;padding:14px 16px;border:2px solid #dee1e6;border-radius:12px;outline:none;font-family:inherit}
  input[type=password]:focus{border-color:#1B56FD}
  .remember{display:flex;align-items:center;gap:10px;margin:16px 0 22px;font-size:16px;color:#0a0b0d;cursor:pointer}
  .remember input{width:22px;height:22px;accent-color:#1B56FD}
  button{width:100%;border:none;border-radius:14px;background:#1B56FD;color:#fff;font-family:inherit;font-size:22px;
    font-weight:900;letter-spacing:.08em;padding:18px;cursor:pointer}
  button:active{background:#1446d6}
  button:disabled{opacity:.6}
  .msg{min-height:24px;margin-top:14px;font-size:15px;font-weight:700;color:#c0202d}
  .msg.info{color:#5b616e}
</style>
</head>
<body>
<header>BALLER'S BASKETBALL QUIZ</header>
<main>
  <form class="card" id="form" autocomplete="off">
    <h1>LOGIN</h1>
    <p class="lead">スタッフ用のパスワードを入力してね。</p>
    <label class="f" for="pw">パスワード</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <label class="remember"><input type="checkbox" id="remember" checked>この端末で記憶する(次回から入力不要)</label>
    <button type="submit" id="go">ENTER</button>
    <div class="msg" id="msg"></div>
  </form>
</main>

  var KEY_STORE = "bbquiz-auth-key";
  var $ = function(id){ return document.getElementById(id); };
  function fromB64(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
  function toB64(u){ var s=""; for(var i=0;i<u.length;i++) s+=String.fromCharCode(u[i]); return btoa(s); }

  if(!window.crypto || !crypto.subtle){
    $("msg").textContent = "このページは https のURLで開いてね。";
    $("go").disabled = true;
    return;
  }

  function deriveBits(password){
    return crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"])
      .then(function(base){
        return crypto.subtle.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:fromB64(PAYLOAD.salt), iterations:PAYLOAD.it}, base, 256);
      }).then(function(bits){ return new Uint8Array(bits); });
  }
  function decryptWith(bits){
    return crypto.subtle.importKey("raw", bits, "AES-GCM", false, ["decrypt"])
      .then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM", iv:fromB64(PAYLOAD.iv)}, key, fromB64(PAYLOAD.data)); })
      .then(function(buf){ return new TextDecoder().decode(buf); });
  }
  // クイズを開いた後もホーム画面アイコン(BQ)が使われるよう、アイコンの指定を入れてから表示する
  var ICON_TAGS = '<link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="apple-touch-icon.png">';
  function open(html){
    if(html.indexOf('rel="apple-touch-icon"') < 0) html = html.replace(/<head>/i, '<head>' + ICON_TAGS);
    document.open(); document.write(html); document.close();
  }

  // 記憶済みの鍵があれば自動で開く(パスワードを変えたら自動で無効になる)
  try{
    var saved = JSON.parse(localStorage.getItem(KEY_STORE) || "null");
    if(saved && saved.salt === PAYLOAD.salt){
      $("msg").className = "msg info"; $("msg").textContent = "読み込み中...";
      decryptWith(fromB64(saved.key)).then(open).catch(function(){
        localStorage.removeItem(KEY_STORE); $("msg").textContent = "";
      });
    }
  }catch(e){}

  $("form").addEventListener("submit", function(e){
    e.preventDefault();
    var pw = $("pw").value;
    if(!pw) return;
    $("go").disabled = true;
    $("msg").className = "msg info"; $("msg").textContent = "確認中...";
    var bits;
    deriveBits(pw).then(function(b){ bits = b; return decryptWith(b); }).then(function(html){
      try{
        if($("remember").checked) localStorage.setItem(KEY_STORE, JSON.stringify({salt:PAYLOAD.salt, key:toB64(bits)}));
        else localStorage.removeItem(KEY_STORE);
      }catch(err){}
      open(html);
    }).catch(function(){
      $("go").disabled = false;
      $("msg").className = "msg"; $("msg").textContent = "パスワードが違うよ。もう一度入力してね。";
      $("pw").value = ""; $("pw").focus();
    });
  });
})();
</script>
